name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      # actions/checkout v7.0.1 (SHA checked against the tag list 2026-11-03)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e

  security-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks (full history, no secrets or license needed)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

      - name: osv-scanner (package-lock.json)
        # google/osv-scanner-action v2.7.0. BLOCKING (F-11): accepted advisories are listed, with reason and expiry,
        # in .github/osv-scanner.toml.
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36
        with:
          scan-args: |-
            --config=.github/osv-scanner.toml
            --lockfile=package-lock.json

  ooxml-validate:
    # X-08: exported INVESTc workbooks pass the OpenXML SDK validator and load in LibreOffice headless.
    # CI-only: locally `node tools/ooxml-validate/run.ts` skips whichever tool is not installed.
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 (SHA checked against the tag list 2026-11-03)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      # Pure-JS dependencies are enough to export the samples; no native builds or Electron download.
      - run: npm ci --ignore-scripts
      # actions/setup-dotnet v6.1.0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '8.0.x'
      - name: Install LibreOffice (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc-nogui
      - run: node tools/ooxml-validate/run.ts --require
