name: Release (draft)

# Builds a tagged release and uploads it as a DRAFT. Nothing is ever published automatically:
# the maintainer downloads the draft assets, signs release-manifest.json OFFLINE (tools/release/sign-manifest.ts),
# uploads the manifest + two signatures, re-verifies and only then publishes. See docs/RELEASE-RUNBOOK.md.
# No signing key is available to CI, by design.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    # F-11: the SBOM tool is fetched by npx with its own (unlocked) dependency tree, so it runs in a job that can
    # only read the repository; the build job (which may create the draft release) never executes it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: CycloneDX SBOM
        # @cyclonedx/cyclonedx-npm pinned (latest release checked 2026-11-03).
        run: |
          V="$(node -p "require('./package.json').version")"
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --output-file "vss-${V}.cdx.json"
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom
          path: vss-*.cdx.json
          if-no-files-found: error

  build:
    needs: sbom
    runs-on: windows-latest
    permissions:
      contents: write # create the draft release only
    defaults:
      run:
        shell: bash
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - name: Tag must match package.json version
        run: |
          V="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${V}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${V}"; exit 1
          fi
          echo "VSS_VERSION=${V}" >> "$GITHUB_ENV"

      - name: Refuse placeholder update-signing keys
        run: |
          if grep -n "placeholder: true" src/main/update/keys.ts; then
            echo "::error::src/main/update/keys.ts still contains TEST/PLACEHOLDER keys. Run the key ceremony first (docs/RELEASE-RUNBOOK.md)."
            exit 1
          fi

      - name: Reproducible timestamp from the tagged commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Build NSIS + portable (unsigned, never published by electron-builder)
        run: npm run dist

      - name: Electron fuses are flipped in the packaged exe (F-11)
        run: npm run verify:fuses -- "dist/win-unpacked/Vetting Support System.exe"

      # actions/download-artifact v8.0.2 (the SBOM built by the read-only job)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sbom
          path: dist

      - name: Collect assets + SHA512SUMS
        run: |
          mkdir -p release-assets
          cp dist/*.exe dist/latest.yml "dist/vss-${VSS_VERSION}.cdx.json" release-assets/
          cp dist/*.blockmap release-assets/ 2>/dev/null || true
          cd release-assets
          sha512sum -- * | sed 's/ \*/  /' > SHA512SUMS
          cat SHA512SUMS

      - name: Upload as DRAFT release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft --verify-tag \
            --title "VSS ${VSS_VERSION}" \
            --notes "DRAFT - not yet signed. Do not publish until release-manifest.json and both signatures are attached and verified (docs/RELEASE-RUNBOOK.md)." \
            release-assets/*
